name: AdBot - Daily Auto Post

# ⛔ 자동 발행 중단 (2026-07-28)
#
# 3개월간 100편을 발행했으나 Search Console 기준 클릭 0 / 노출 12에 그쳤다.
# 같은 기간 오늘장부 블로그(자체 도메인)는 같은 주제로 노출 447 / 클릭 11이 나왔다.
# 주제와 제목 키워드는 문제가 없었고, 차이는 다음 두 가지로 보인다.
#   1) blogspot.com 서브도메인은 자체 도메인보다 검색 신뢰도가 낮다.
#   2) 한글 제목이 슬러그로 변환되면서 URL 에 키워드가 남지 않았다.
#      예: /2026/07/2026-vs-7.html, /2026/07/37-2026.html
# 두 채널이 같은 검색어를 놓고 경쟁하는데 한쪽이 구조적으로 불리하므로,
# 오늘장부 쪽에 집중하기로 하고 이 봇의 자동 실행을 멈춘다.
#
# 코드와 이력은 그대로 둔다. 재개하려면 아래 schedule 주석을 풀고
# GitHub Actions 에서 이 워크플로를 다시 활성화하면 된다.
# workflow_dispatch 는 남겨두어 수동 실행은 계속 가능하다.
on:
  # schedule:
  #   - cron: "0 0 * * *"   # 매일 오전 9시 KST
  #   - cron: "0 6 * * *"   # 매일 오후 3시 KST
  workflow_dispatch:
    inputs:
      count:
        description: "생성할 글 수 (회차당)"
        required: false
        default: "1"
      draft:
        description: "초안으로 저장? (true/false)"
        required: false
        default: "false"
      keyword:
        description: "특정 키워드 (비워두면 트렌드 자동 수집)"
        required: false
        default: ""

jobs:
  run-adbot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # 로그 커밋을 위해 필요
    # 동시 실행 방지 (같은 시간대 중복 트리거 시)
    concurrency:
      group: adbot-post
      cancel-in-progress: false

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          # 로그 커밋을 위해 쓰기 권한 필요
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Blogger 인증 토큰 복원
        run: |
          mkdir -p config
          echo '${{ secrets.BLOGGER_TOKEN_JSON }}' > config/token.json
          echo '${{ secrets.BLOGGER_CREDENTIALS_JSON }}' > config/credentials.json

      - name: 이전 로그 복원 (중복 방지 상태)
        run: |
          mkdir -p src/logs
          cp -f logs/*.json src/logs/ 2>/dev/null || true
          echo "복원된 로그:"
          ls src/logs/ 2>/dev/null || echo "없음 (첫 실행)"

      - name: AdBot 실행
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          POSTS_PER_DAY: ${{ github.event.inputs.count || '1' }}
          PUBLISH_AS_DRAFT: ${{ github.event.inputs.draft || 'false' }}
          GITHUB_ACTIONS: "true"
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          cd src
          if [ -n "${{ github.event.inputs.keyword }}" ]; then
            python main.py --count ${{ github.event.inputs.count || 1 }} --keyword "${{ github.event.inputs.keyword }}"
          elif [ "${{ github.event.inputs.draft }}" = "true" ]; then
            python main.py --count ${{ github.event.inputs.count || 1 }} --draft
          else
            python main.py --count ${{ github.event.inputs.count || 1 }}
          fi

      - name: 통계 출력
        if: always()
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GITHUB_ACTIONS: "true"
        run: |
          cd src
          python main.py --stats || true

      - name: 로그 상태 저장 (중복 방지용)
        if: always()
        run: |
          git config user.name "AdBot[bot]"
          git config user.email "adbot@github-actions"
          # src/logs/ → 루트 logs/ 로 경로 통일
          mkdir -p logs
          cp -f src/logs/*.json logs/ 2>/dev/null || true
          git add logs/ || true
          git diff --cached --quiet || git commit -m "chore: AdBot 실행 로그 업데이트 [skip ci]"
          git push || true

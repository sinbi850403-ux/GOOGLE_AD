name: AdBot - Daily Auto Post

# 자동 발행 재개 (2026-08-16)
#
# 중단 사유였던 두 가지 중 하나를 해결했다.
#   1) blogspot 서브도메인 신뢰도 — 미해결. 구조적 한계라 코드로 못 고친다.
#   2) URL 에 키워드가 안 남던 문제 — 해결. 영문 슬러그를 지정하도록 고쳤고
#      실제 발행으로 확인했다(restaurant-inventory-management.html).
# 함께 고친 것: Google Trends 404(RSS 로 교체), 토큰 갱신 실패 시 재로그인,
# 무작위 자리표시자 사진 발행.
#
# 주제는 급상승 검색어에서 가져오되 인물·사건성은 제외하고 실용 안내만
# 쓴다(src/trend_picker.py). 애드센스는 계정 단위라 이 블로그가 걸리면
# 같은 계정의 오늘장부까지 위험해지기 때문이다.
#
# 2~3주 뒤 Search Console 노출이 오르지 않으면 blogspot 자체가 한계이므로
# 다시 멈추고 자체 도메인으로 옮기는 것을 검토한다.
on:
  schedule:
    - cron: "0 0 * * *"   # 매일 오전 9시 KST
    - cron: "0 6 * * *"   # 매일 오후 3시 KST
  workflow_dispatch:
    inputs:
      count:
        description: "생성할 글 수 (회차당)"
        required: false
        default: "1"
      draft:
        description: "초안으로 저장? (true/false)"
        required: false
        default: "false"
      keyword:
        description: "특정 키워드 (비워두면 트렌드 자동 수집)"
        required: false
        default: ""

jobs:
  run-adbot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # 로그 커밋을 위해 필요
    # 동시 실행 방지 (같은 시간대 중복 트리거 시)
    concurrency:
      group: adbot-post
      cancel-in-progress: false

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          # 로그 커밋을 위해 쓰기 권한 필요
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Blogger 인증 토큰 복원
        run: |
          mkdir -p config
          echo '${{ secrets.BLOGGER_TOKEN_JSON }}' > config/token.json
          echo '${{ secrets.BLOGGER_CREDENTIALS_JSON }}' > config/credentials.json

      - name: 이전 로그 복원 (중복 방지 상태)
        run: |
          mkdir -p src/logs
          cp -f logs/*.json src/logs/ 2>/dev/null || true
          echo "복원된 로그:"
          ls src/logs/ 2>/dev/null || echo "없음 (첫 실행)"

      - name: AdBot 실행
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          NCP_API_KEY_ID: ${{ secrets.NCP_API_KEY_ID }}
          NCP_API_KEY: ${{ secrets.NCP_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          POSTS_PER_DAY: ${{ github.event.inputs.count || '1' }}
          PUBLISH_AS_DRAFT: ${{ github.event.inputs.draft || 'false' }}
          GITHUB_ACTIONS: "true"
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          cd src
          if [ -n "${{ github.event.inputs.keyword }}" ]; then
            python main.py --count ${{ github.event.inputs.count || 1 }} --keyword "${{ github.event.inputs.keyword }}"
          elif [ "${{ github.event.inputs.draft }}" = "true" ]; then
            python main.py --count ${{ github.event.inputs.count || 1 }} --draft
          else
            python main.py --count ${{ github.event.inputs.count || 1 }}
          fi

      - name: 통계 출력
        if: always()
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GITHUB_ACTIONS: "true"
        run: |
          cd src
          python main.py --stats || true

      - name: 로그 상태 저장 (중복 방지용)
        if: always()
        run: |
          git config user.name "AdBot[bot]"
          git config user.email "adbot@github-actions"
          # src/logs/ → 루트 logs/ 로 경로 통일
          mkdir -p logs
          cp -f src/logs/*.json logs/ 2>/dev/null || true
          git add logs/ || true
          git diff --cached --quiet || git commit -m "chore: AdBot 실행 로그 업데이트 [skip ci]"
          git push || true
